server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: analytics-service

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET:YWN0aXZpdHl1YWwtbG9jYWwtand0LXNlY3JldC1rZXktMzI=}
  aws:
    region: ${AWS_REGION:ap-south-1}
    access-key: ${AWS_ACCESS_KEY_ID:local}
    secret-key: ${AWS_SECRET_ACCESS_KEY:local}
  dynamodb:
    endpoint: ${DYNAMODB_ENDPOINT:http://localhost:8000}
    analytics-table: ActivityAnalytics