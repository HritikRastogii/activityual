openapi: 3.0.3
info:
  title: Activityual Analytics Service API
  version: 1.0.0
servers:
  - url: http://localhost:8084
security:
  - bearerAuth: []
paths:
  /api/v1/analytics:
    get:
      summary: Get analytics for the authenticated user
      responses:
        '200': {description: Analytics items returned from DynamoDB}
  /api/v1/analytics/{activityId}:
    get:
      summary: Get analytics for one activity
      parameters:
        - in: path
          name: activityId
          required: true
          schema: {type: string}
      responses:
        '200': {description: Activity analytics item}
        '404': {description: Analytics item not found}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
